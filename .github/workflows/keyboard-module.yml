name: Build keyboard module
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: ubuntu-22.04
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        side: [left, right]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local module import
        run: python3 tests/keyboard-config/prepare.py --source "$GITHUB_WORKSPACE" --workspace /tmp/satellite-keyboard
      - name: Fetch keyboard dependencies
        working-directory: /tmp/satellite-keyboard
        run: |
          west init -l config
          west config manifest.project-filter -- '-.*,+zmk,+zephyr,+zmk-satellite,+prospector-zmk-module,+cmsis,+hal_nordic,+lvgl,+segger,+tinycrypt,+nanopb,+zmk-studio-messages'
          west update --narrow
      - name: Build stock Corne with only ON enabled
        working-directory: /tmp/satellite-keyboard
        run: west build -s zmk/app -b nice_nano_v2 -d build -- -DSHIELD=corne_${{ matrix.side }} -DZMK_CONFIG=/tmp/satellite-keyboard/config
      - name: Check role-specific behavior
        working-directory: /tmp/satellite-keyboard
        env:
          SIDE: ${{ matrix.side }}
        run: |
          grep -q '^CONFIG_ZMK_SATELLITE=y$' build/zephyr/.config
          if [ "$SIDE" = left ]; then
            grep -q '^CONFIG_ZMK_STATUS_ADVERTISEMENT=y$' build/zephyr/.config
            grep -q '^CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y$' build/zephyr/.config
          else
            ! grep -q '^CONFIG_ZMK_STATUS_ADVERTISEMENT=y$' build/zephyr/.config
          fi
