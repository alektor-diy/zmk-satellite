name: Build prototype firmware
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test-host.sh
      - name: Upload license notices
        uses: actions/upload-artifact@v4
        with:
          name: licenses
          if-no-files-found: error
          path: |
            LICENSE
            THIRD_PARTY_NOTICES.md
            licenses/
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: status
            artifact: satellite
          - stage: display
            artifact: satellite_demo
          - stage: ble
            artifact: satellite_debug
    steps:
      - uses: actions/checkout@v4
        with:
          path: zmk-satellite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build device-tree-compiler gperf
          pip install west 'cmake<4'
          west init -l zmk-satellite
          west update
          pip install -r zephyr/scripts/requirements-base.txt
          west zephyr-export
          west sdk install --version 0.17.0 --toolchains arm-zephyr-eabi
      - name: Build XIAO firmware
        run: west build -b xiao_ble/nrf52840 zmk-satellite -d build -- -DSATELLITE_STAGE=${{ matrix.stage }}
      - name: Prepare firmware download
        run: |
          mkdir -p artifacts
          cp build/zephyr/zephyr.uf2 "artifacts/${{ matrix.artifact }}.uf2"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}.uf2
          if-no-files-found: error
