name: Build firmware
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    env:
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/zephyr-sdk-0.17.0
    steps:
      - uses: actions/checkout@v4
        with:
          path: zmk-satellite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build device-tree-compiler gperf
          pip install west 'cmake<4'
          west init -l zmk-satellite
          west update
          pip install -r zephyr/scripts/requirements-base.txt
      - name: Install ARM SDK
        # Fixed release assets avoid the GitHub releases API and its rate limit.
        # Only the minimal SDK and the XIAO's ARM toolchain are needed.
        run: |
          base=https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.0
          curl --fail --location --retry 3 --output sdk.tar.xz "$base/zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz"
          curl --fail --location --retry 3 --output arm.tar.xz "$base/toolchain_linux-x86_64_arm-zephyr-eabi.tar.xz"
          echo '0514d2c684dfb5f6327374bfed0b3dcf727ff1500195d26b3730f98252fed095  sdk.tar.xz' | sha256sum --check
          echo 'c3992a788a0896ecc87f7fb3a3be3f234ec0509220bd4e9dbd99b22edd55e97f  arm.tar.xz' | sha256sum --check
          tar -xf sdk.tar.xz
          tar -xf arm.tar.xz -C "$ZEPHYR_SDK_INSTALL_DIR"
      - name: Build three UF2 files
        run: |
          mkdir -p artifacts
          for entry in status:satellite display:satellite_demo ble:satellite_debug; do
            stage=${entry%%:*}
            name=${entry#*:}
            west build -b xiao_ble/nrf52840 zmk-satellite -d "build-$stage" -- -DSATELLITE_STAGE="$stage"
            cp "build-$stage/zephyr/zephyr.uf2" "artifacts/$name.uf2"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: satellite
          path: artifacts/satellite.uf2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: satellite_demo
          path: artifacts/satellite_demo.uf2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: satellite_debug
          path: artifacts/satellite_debug.uf2
          if-no-files-found: error
