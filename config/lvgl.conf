CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y
# Zephyr lv_conf.h aliases lv_snprintf/lv_vsnprintf to libc. Do not compile wrappers.
CONFIG_LV_USE_CUSTOM_SPRINTF=y
CONFIG_LV_Z_AUTO_INIT=n
